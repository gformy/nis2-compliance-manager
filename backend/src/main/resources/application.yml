spring:
  application:
    name: nis2-compliance-manager

  # Connessione dell'applicazione: utente con soli permessi sui dati.
  # CURRENT_SCHEMA fa risolvere i nomi delle tabelle nello schema proprietario.
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_APP_USER:nis2_app}
    password: ${DB_APP_PASSWORD}
    hikari:
      connection-init-sql: ALTER SESSION SET CURRENT_SCHEMA = ${DB_OWNER_USER:nis2_owner}

  # Migrazioni: unico punto in cui si usa il proprietario dello schema.
  flyway:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    user: ${DB_OWNER_USER:nis2_owner}
    password: ${DB_OWNER_PASSWORD}
    placeholders:
      app_user: ${DB_APP_USER:nis2_app}
    # I dati demo (profilo demo) sono una migrazione ripetibile che negli altri
    # avvii non c'e': non deve far fallire la validazione di Flyway.
    ignore-migration-patterns: "*:future,repeatable:missing"

  # Documenti di governance: file fino a 10 MB (vedi FileCaricati).
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  # Il backend accetta solo token firmati dal realm nis2 di Keycloak.
  # Le chiavi pubbliche si scaricano dall'issuer alla prima richiesta.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/nis2}

management:
  endpoints:
    web:
      exposure:
        include: health
