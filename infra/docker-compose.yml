# Ambiente locale: Oracle Database Free e Keycloak.
# Avvio:  cp .env.example .env  (e cambia le password)  poi  docker compose up -d
# Il backend si avvia a parte (vedi README) e applica le migrazioni Flyway.

name: nis2

services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    ports:
      - "127.0.0.1:1521:1521"   # solo da questo computer, non dalla rete
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?imposta ORACLE_PASSWORD in .env}
      APP_USER: ${DB_OWNER_USER:-nis2_owner}
      APP_USER_PASSWORD: ${DB_OWNER_PASSWORD:?imposta DB_OWNER_PASSWORD in .env}
      NIS2_APP_USER: ${DB_APP_USER:-nis2_app}
      NIS2_APP_PASSWORD: ${DB_APP_PASSWORD:?imposta DB_APP_PASSWORD in .env}
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./oracle/init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    ports:
      - "127.0.0.1:8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?imposta KEYCLOAK_ADMIN_PASSWORD in .env}
    volumes:
      - ./keycloak/nis2-realm.json:/opt/keycloak/data/import/nis2-realm.json:ro

volumes:
  oracle-data:
