spring:
  application:
    name: nis2-compliance-manager

  # Connessione dell'applicazione: utente con soli permessi sui dati.
  # CURRENT_SCHEMA fa risolvere i nomi delle tabelle nello schema proprietario.
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_APP_USER:nis2_app}
    password: ${DB_APP_PASSWORD}
    hikari:
      connection-init-sql: ALTER SESSION SET CURRENT_SCHEMA = ${DB_OWNER_USER:nis2_owner}

  # Migrazioni: unico punto in cui si usa il proprietario dello schema.
  flyway:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    user: ${DB_OWNER_USER:nis2_owner}
    password: ${DB_OWNER_PASSWORD}
    placeholders:
      app_user: ${DB_APP_USER:nis2_app}

management:
  endpoints:
    web:
      exposure:
        include: health
